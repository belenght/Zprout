<div class="min-h-screen flex flex-col bg-stone-100">
  <!-- Barra superior -->
  <header class="h-16 shrink-0 bg-brand-900 text-white flex items-center justify-between px-6 z-10">
    <h1 class="font-display text-xl font-bold">
      <span class="text-gold-400">Z</span>prout
    </h1>

    <div class="flex items-center gap-3">
      <div class="hidden sm:flex items-center gap-2 text-sm text-brand-100">
        <span class="material-symbols-outlined text-[18px]">event</span>
        {{ campanaActiva }}
      </div>

      @if (usuario(); as u) {
        <div class="flex items-center gap-2">
          <div
            class="h-9 w-9 rounded-full bg-brand-600 flex items-center justify-center text-sm font-semibold"
            [title]="u.nombre + ' · ' + u.perfil"
          >
            {{ iniciales(u.nombre) }}
          </div>
        </div>
      }

      <button
        (click)="cerrarSesion()"
        class="text-sm text-brand-100 hover:text-white transition-colors"
        title="Cerrar sesión"
      >
        <span class="material-symbols-outlined text-[20px] align-middle">logout</span>
      </button>
    </div>
  </header>

  <div class="flex-1 flex min-h-0">
    <!-- Sidebar -->
    <aside class="w-60 shrink-0 bg-white border-r border-stone-200 flex flex-col">
      <nav class="flex-1 overflow-y-auto py-4">
        @for (grupo of navGroups; track grupo.titulo) {
          @if (grupo.titulo) {
            <p class="px-5 mt-4 mb-1 text-xs font-medium uppercase tracking-wide text-stone-400">{{ grupo.titulo }}</p>
          }
          <ul class="space-y-0.5 px-2">
            @for (item of grupo.items; track item.path) {
              <li>
                <a
                  [routerLink]="item.path"
                  routerLinkActive="bg-brand-800 text-white"
                  class="flex items-center gap-3 rounded-md px-3 py-2 text-sm text-stone-600 hover:bg-brand-50 hover:text-brand-900 transition-colors"
                >
                  <span class="material-symbols-outlined text-[20px]">{{ item.icon }}</span>
                  {{ item.label }}
                </a>
              </li>
            }
          </ul>
        }
      </nav>
    </aside>

    <!-- Contenido -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
