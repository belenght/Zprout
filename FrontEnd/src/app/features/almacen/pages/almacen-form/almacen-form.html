<h1 class="text-xl font-semibold text-stone-800 mb-6">Nuevo almacén</h1>

<form [formGroup]="form" (ngSubmit)="guardar()" class="max-w-md space-y-4">
  <div>
    <label class="block text-sm font-medium text-stone-700 mb-1" for="tipo">Tipo</label>
    <select
      id="tipo"
      formControlName="tipo"
      class="w-full rounded-md border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600"
    >
      <option value="silo">Silo (grano a granel)</option>
      <option value="galpon">Galpón (bolsón filtrado)</option>
      <option value="deposito">Depósito (bolsas curadas)</option>
    </select>
  </div>

  <div>
    <label class="block text-sm font-medium text-stone-700 mb-1" for="capacidad">Capacidad (tn)</label>
    <input
      id="capacidad"
      type="number"
      step="0.1"
      formControlName="capacidad"
      class="w-full rounded-md border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600"
    />
  </div>

  <div class="flex gap-3 pt-2">
    <button
      type="submit"
      [disabled]="enviando()"
      class="rounded-md bg-brand-700 text-white text-sm font-semibold px-5 py-2.5 hover:bg-brand-800 transition-colors disabled:opacity-60"
    >
      ✓ Crear almacén
    </button>
    <a routerLink="/almacen" class="rounded-md border border-stone-300 text-sm font-medium px-5 py-2.5 text-stone-700 hover:bg-stone-50">
      Cancelar
    </a>
  </div>
</form>
