<div class="flex min-h-screen">
  <!-- Panel de marca (wireframe GUI-01/02): oculto en pantallas chicas -->
  <div class="relative hidden w-full max-w-md flex-col justify-between overflow-hidden bg-brand-950 px-10 py-12 text-white md:flex lg:max-w-lg">
    <div class="pointer-events-none absolute -right-24 top-8 h-72 w-72 rounded-full bg-brand-800/60"></div>
    <div class="pointer-events-none absolute right-6 top-24 h-56 w-56 rounded-full bg-brand-700/40"></div>
    <div class="pointer-events-none absolute -bottom-24 -left-16 h-72 w-72 rounded-full bg-brand-900"></div>

    <h1 class="relative z-10 font-display text-4xl">
      <span class="text-gold-500">Z</span>prout
    </h1>

    <p class="relative z-10 text-lg leading-relaxed text-brand-50">
      Gestión integral del<br>
      ciclo productivo<br>
      de semillas
    </p>
  </div>

  <!-- Panel del formulario -->
  <div class="flex flex-1 items-center justify-center bg-gray-50 px-6 py-12">
    <div class="w-full max-w-md rounded-xl border border-brand-100 bg-white p-8 shadow-sm">
      <h3 class="mb-1 font-display text-2xl text-brand-900">Iniciar Sesión</h3>
      <p class="mb-6 text-sm text-gray-500">Ingresá tus credenciales para continuar</p>

      <form [formGroup]="form" (ngSubmit)="login()" class="space-y-4">
        <div>
          <label for="nombre_usuario" class="mb-1 block text-sm font-medium text-brand-900">Usuario</label>
          <input
            type="text"
            id="nombre_usuario"
            formControlName="nombre_usuario"
            class="w-full rounded-md border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
            [class.border-red-500]="form.get('nombre_usuario')?.invalid && form.get('nombre_usuario')?.touched"
            [class.border-gray-300]="!(form.get('nombre_usuario')?.invalid && form.get('nombre_usuario')?.touched)"
          >
        </div>

        <div>
          <label for="password" class="mb-1 block text-sm font-medium text-brand-900">Contraseña</label>
          <div class="flex">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              class="w-full rounded-l-md border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
              [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched"
              [class.border-gray-300]="!(form.get('password')?.invalid && form.get('password')?.touched)"
            >
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="rounded-r-md border border-l-0 border-gray-300 px-3 text-brand-700 hover:bg-brand-50"
            >
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="cargando"
          class="w-full rounded-md bg-brand-700 py-2.5 font-medium text-white transition hover:bg-brand-800 disabled:cursor-not-allowed disabled:opacity-60"
        >
          <span *ngIf="cargando" class="mr-2 inline-block h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent align-[-2px]"></span>
          Ingresar
        </button>
      </form>
    </div>
  </div>
</div>
