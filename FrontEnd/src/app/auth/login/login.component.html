<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4" style="min-width: 320px; max-width: 400px;">
    <h3 class="text-center mb-4">
      <i class="bi bi-flower1"></i> Zprout
    </h3>

    <form [formGroup]="form" (ngSubmit)="login()">
      <div class="mb-3">
        <label for="nombre_usuario" class="form-label">Usuario</label>
        <input
          type="text"
          id="nombre_usuario"
          class="form-control"
          formControlName="nombre_usuario"
          [class.is-invalid]="form.get('nombre_usuario')?.invalid && form.get('nombre_usuario')?.touched"
        >
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            class="form-control"
            formControlName="password"
            [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
          >
          <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
        Ingresar
      </button>
    </form>
  </div>
</div>
