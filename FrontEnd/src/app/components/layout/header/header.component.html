<header *ngIf="autenticado" class="sticky top-0 z-20 flex h-16 items-center justify-between bg-brand-900 px-6 text-white">
  <a routerLink="/" class="font-display text-xl">
    <span class="text-gold-500">Z</span>prout
  </a>

  <div class="relative">
    <button
      type="button"
      (click)="toggleMenu()"
      class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-600 text-sm font-semibold hover:bg-brand-500"
    >
      {{ iniciales }}
    </button>

    <div
      *ngIf="menuAbierto"
      class="absolute right-0 top-11 w-48 rounded-md border border-brand-100 bg-white py-1 text-sm text-brand-900 shadow-lg"
    >
      <div class="border-b border-brand-100 px-3 py-2">
        <div class="font-medium">{{ nombre }}</div>
        <div class="text-xs text-gray-400">{{ rol }}</div>
      </div>
      <button
        type="button"
        (click)="logout()"
        class="flex w-full items-center gap-2 px-3 py-2 text-left hover:bg-brand-50"
      >
        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
      </button>
    </div>
  </div>
</header>
