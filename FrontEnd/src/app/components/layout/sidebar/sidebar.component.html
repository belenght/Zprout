<aside *ngIf="autenticado$ | async" class="hidden w-52 shrink-0 border-r border-brand-100 bg-brand-50 px-3 py-4 sm:block">
  <nav class="space-y-1.5">
    <ng-container *ngFor="let item of itemsVisibles">
      <a
        *ngIf="item.ruta"
        [routerLink]="item.ruta"
        routerLinkActive="bg-brand-900! text-white! font-bold"
        [routerLinkActiveOptions]="{ exact: item.ruta === '/' }"
        class="flex items-center gap-3 rounded-lg px-4 py-2.5 text-sm text-brand-900 hover:bg-brand-100"
      >
        <i class="bi {{ item.icono }} w-4 text-center"></i>
        {{ item.label }}
      </a>

      <span
        *ngIf="!item.ruta"
        title="Todavía no implementado"
        class="flex cursor-not-allowed items-center gap-3 rounded-lg px-4 py-2.5 text-sm text-gray-300"
      >
        <i class="bi {{ item.icono }} w-4 text-center"></i>
        {{ item.label }}
      </span>
    </ng-container>
  </nav>
</aside>
