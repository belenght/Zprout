<div class="mx-auto max-w-6xl px-4 py-6">
  <div class="rounded-lg border border-brand-100">
    <div class="bg-brand-900 px-4 py-3 text-white">
      <h4 class="m-0 font-display text-lg">Registrar ingreso de lote</h4>
    </div>

    <div class="p-4">
      <form [formGroup]="form" (ngSubmit)="registrarIngreso()" class="space-y-4">

        <div>
          <label class="mb-1 block text-sm font-medium text-brand-900">Origen del lote</label>
          <div class="flex w-full overflow-hidden rounded-md border border-brand-200">
            <label class="flex-1 cursor-pointer border-r border-brand-200 px-3 py-2 text-center text-sm text-brand-700 has-[:checked]:bg-brand-700 has-[:checked]:text-white">
              <input type="radio" class="hidden" id="origenPropio" value="propio" formControlName="origen_semilla">
              Produccion propia
            </label>
            <label class="flex-1 cursor-pointer px-3 py-2 text-center text-sm text-gold-500 has-[:checked]:bg-gold-500 has-[:checked]:text-white">
              <input type="radio" class="hidden" id="origenExterno" value="externo" formControlName="origen_semilla">
              Externo
            </label>
          </div>
        </div>

        <div class="flex items-start gap-2 rounded-md border border-amber-200 bg-amber-50 p-3 text-sm text-amber-800" *ngIf="esExterno">
          <i class="bi bi-exclamation-triangle mt-0.5"></i>
          <span>El CC inicial se considera automaticamente aprobado. El lote saltea
          limpieza y curado (solo pasa por el CC final de rutina).</span>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="tipo_semilla_id" class="mb-1 block text-sm font-medium text-brand-900">Cultivo / Variedad</label>
            <select id="tipo_semilla_id" formControlName="tipo_semilla_id" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
              <option [ngValue]="null" disabled>Seleccionar...</option>
              <option *ngFor="let ts of tiposSemilla" [ngValue]="ts.id_semilla">
                {{ ts.nombre_semilla }} / {{ ts.variante_semilla }}
              </option>
            </select>
          </div>

          <div>
            <label for="cantidad_semillas_en_tn" class="mb-1 block text-sm font-medium text-brand-900">Cantidad ingresada (tn)</label>
            <input type="number" step="0.01" id="cantidad_semillas_en_tn" formControlName="cantidad_semillas_en_tn" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>
        </div>

        <div *ngIf="!esExterno">
          <label for="campo_id" class="mb-1 block text-sm font-medium text-brand-900">Campo de procedencia</label>
          <select id="campo_id" formControlName="campo_id" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            <option [ngValue]="null" disabled>Seleccionar...</option>
            <option *ngFor="let c of campos" [ngValue]="c.id_campo">{{ c.nro_campo }} - {{ c.ubicacion }}</option>
          </select>
        </div>

        <ng-container *ngIf="esExterno">
          <div>
            <label for="proveedor_id" class="mb-1 block text-sm font-medium text-brand-900">Proveedor externo</label>
            <select id="proveedor_id" formControlName="proveedor_id" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
              <option [ngValue]="null" disabled>Seleccionar...</option>
              <option *ngFor="let p of proveedores" [ngValue]="p.id_proveedor">{{ p.razon_social }}</option>
            </select>
          </div>

          <div>
            <label for="informe_calidad_externo" class="mb-1 block text-sm font-medium text-brand-900">Informe de calidad del proveedor (URL/referencia)</label>
            <input type="text" id="informe_calidad_externo" formControlName="informe_calidad_externo" placeholder="Ej: link al PDF adjunto" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>
        </ng-container>

        <div>
          <label for="observaciones" class="mb-1 block text-sm font-medium text-brand-900">Observaciones</label>
          <textarea id="observaciones" rows="2" formControlName="observaciones" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
        </div>

        <div class="flex gap-2">
          <button type="submit" [disabled]="guardando" class="inline-flex items-center gap-2 rounded-md bg-brand-700 px-4 py-2 text-sm font-medium text-white hover:bg-brand-800 disabled:cursor-not-allowed disabled:opacity-60">
            <span *ngIf="guardando" class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
            <i class="bi bi-check-lg"></i> Registrar ingreso
          </button>
          <a routerLink="/lotes" class="rounded-md border border-gray-300 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
