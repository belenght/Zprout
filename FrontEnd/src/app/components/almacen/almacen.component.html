<div class="mx-auto max-w-6xl px-4 py-6">
  <h4 class="mb-1 font-display text-xl text-brand-900">Almacén</h4>
  <p class="mb-6 text-sm italic text-gray-400">
    Datos de ejemplo — falta conectar el service real contra /api/almacenes.
  </p>

  <div class="mb-6 grid grid-cols-1 gap-3 sm:grid-cols-2">
    <div *ngFor="let u of unidades" class="rounded-xl border border-brand-100 bg-white p-5">
      <div class="mb-2 font-medium text-brand-900">{{ u.nombre }}</div>
      <div class="mb-1 text-2xl font-bold text-brand-800">{{ u.ocupado_tn }} / {{ u.capacidad_tn }} tn</div>
      <div class="h-2 w-full overflow-hidden rounded-full bg-brand-50">
        <div
          class="h-2 rounded-full bg-brand-600"
          [style.width.%]="(+u.ocupado_tn / +u.capacidad_tn) * 100"
        ></div>
      </div>
    </div>
  </div>

  <h5 class="mb-3 font-display text-lg text-brand-900">Stock por variedad</h5>
  <div class="overflow-hidden rounded-xl border border-brand-100">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-brand-900 text-left text-white">
          <tr>
            <th class="px-4 py-3">Semilla</th>
            <th class="px-4 py-3">Variedad</th>
            <th class="px-4 py-3">Disponible</th>
            <th class="px-4 py-3">Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of stockPorVariedad" class="border-b border-brand-50 hover:bg-brand-50">
            <td class="px-4 py-3">{{ s.semilla }}</td>
            <td class="px-4 py-3">{{ s.variedad }}</td>
            <td class="px-4 py-3">{{ s.disponible }}</td>
            <td class="px-4 py-3">
              <span
                class="rounded-full px-2 py-0.5 text-xs"
                [ngClass]="s.estado === 'Disponible' ? 'bg-brand-100 text-brand-800' : 'bg-red-100 text-red-700'"
              >
                {{ s.estado }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
